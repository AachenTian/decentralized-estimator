seed: 0

env:
  seed_reset: 45
  state_dim: 34
  obs_dim: 18
  act_dim: 5
  ENV_NAME: MPE_simple_spread_v3
  u_noise: [1.0, 1.0, 1.0]

replay:
  capacity: 50000

collect:
  steps_per_epoch: 300  # 每个 epoch 真实环境的步数

train:
  epochs: 200
  batch_size: 1024
  batch_size_std: 300
  model_updates: 50       # 每个 epoch 训练 dynamics 的次数
  gradient_updates: 100   # 每个 epoch 用 D_model 的更新次数
  opp_model_updates: 100  # 每个 epoch 更新 D_model 的更新次数
  num_opponents: 2
  num_landmark: 3
  core_state_dim: 18
  max_steps: 25
  eval_interval: 1
  reinit_opp_model: True

rollout:
  batch_size: 1024
  k: 6                   # 公式里的 k（最长 rollout 步数）
  quantile_opp: 0.99
  zeta1: 0.99
  zeta2: 0.01
  xi: 30.0

model_dynamics:
  lr: 3e-4
  num_members: 10
  hidden_dims: [256, 256, 256, 256]
  min_logvar: -10.0
  max_logvar: 0.5

q_function:
  lr: 3e-4
  gamma: 0.95
  alpha: 0.2
  tau: 0.005
  hidden_dims: [256, 256]
  act_dim: 2
  agent_num: 3
  reward_scale: 1

policy:
  lr: 0.01
  hidden_dims: [64, 64, 64]
  ensemble_size: 5
  min_logvar: -5.0
  max_logvar: 2.0
  alpha: 0.2

independent_dynamics:
  train_data_steps: 50000
  eval_data_steps: 10000
  gradient_steps: 5000
  batch_size: 1024
  eval_interval: 250

  rollout_horizon: 20
  rollout_num_starts: 100

  initial_measurement_variance: 1.0e-8
  include_action_uncertainty: false
  manual_action_variance: 0.0
  
  checkpoint_path: checkpoints/independent_dynamics_unoise1_50k_5k.pkl
  save_checkpoint: true



online_estimator:
  enabled: false

  ego_agent_id: 0
  num_episodes: 3
  max_steps_per_episode: 25

  communication_mode: initial_sync_only
  periodic_interval: 5
  event_trigger_threshold: 0.20

  dynamics_prediction_mode: standard
  epistemic_process_scale: 0.0

  initial_variance: 1.0e-8
  measurement_variance: 1.0e-8

  action_min: -1.0
  action_max: 1.0

  trace_enabled: false
  trace_episode_index: 0
  trace_directory: results/traces